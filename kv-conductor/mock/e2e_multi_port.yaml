# ── KV Conductor ───────────────────────────────────────────────────────
# Shared by single-port and multi-port e2e tests.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindie-motor-kv-conductor
  labels:
    app: mindie-motor-kv-conductor
  namespace: mindie-motor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mindie-motor-kv-conductor
  template:
    metadata:
      labels:
        app: mindie-motor-kv-conductor
    spec:
      terminationGracePeriodSeconds: 5
      automountServiceAccountToken: false
      containers:
      - image: kv-conductor:latest
        imagePullPolicy: IfNotPresent
        name: kv-conductor
        env:
        - name: RUST_LOG
          value: info
        ports:
        - containerPort: 13333
          protocol: TCP
        resources:
          requests: {memory: "64Mi", cpu: "100m"}
          limits:   {memory: "256Mi", cpu: "500m"}

---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: mindie-motor-kv-conductor
  name: kv-conductor
  namespace: mindie-motor
spec:
  ports:
  - port: 13333
    protocol: TCP
    targetPort: 13333
  selector:
    app: mindie-motor-kv-conductor
  type: ClusterIP
