## MetaService address. The K8s service FQDN placeholder is replaced by
## common.sh at deploy time using $KVS_MASTER_SERVICE.
ock.mmc.meta_service_url = tcp://mindie-motor-kvs-master:50088

## ConfigStore address for MetaService. Same DNS replacement as above.
ock.mmc.local_service.config_store_url = tcp://mindie-motor-kvs-master:50089

## Backend identity for kv_event broadcasting, e.g. Pod IP. The placeholder
## is replaced by common.sh at deploy time using $POD_IP.
ock.mmc.local_service.backend_id = <POD_IP>

## Log level: debug, info, warn, error
ock.mmc.log_level = info

## Maximum supported rank count.
ock.mmc.local_service.world_size = 256

## Data transfer protocol — configure based on hardware type:
##   A2 (800I_A2 / 800T_A2)  →  device_rdma
##   A3                       →  device_sdma
##   A5                       →  device_urma
ock.mmc.local_service.protocol = device_sdma

## Per-process DRAM pool size.
##   inprocess:  each vLLM worker's DRAM quota (total pool ÷ worker count).
##   standalone: set to 0GB (vLLM does not manage DRAM; standalone LS owns it).
ock.mmc.local_service.dram.size = 0GB

## Maximum DRAM pool size per process.
ock.mmc.local_service.max.dram.size = 1024GB

## Best-effort DRAM allocation: if the configured dram.size exceeds actual
## available memory, LocalService starts with the available amount rather
## than failing. Recommended to leave enabled.
ock.mmc.local_service.dram.best_effort.enabled = true

## Whether to enable SSD cache (L3).
##   ubsio.disk.path is empty → false.
##   ubsio.disk.path is set:
##     dram.size = 0GB → false (DRAM managed by another process).
##     dram.size > 0GB → true  (this process manages its own DRAM pool).
ock.mmc.local_service.storage.enabled = false

## ---------------------------------------------------------------------------
## UBSIO / SSD cache (L3) configuration
## ---------------------------------------------------------------------------

## SSD cache device paths (from partition_disks.sh output). Leave empty for no-disk mode.
ubsio.disk.path =

## UBSIO memory pool size in GB.
ubsio.mem.size_in_gb = 10

## Write-cache memory eviction water level (percentage of write-cache memory).
ubsio.wcache.evict_water_level = 0

## Write-cache disk eviction water level (percentage of configured SSD cache capacity).
## Only meaningful when ubsio.disk.path is non-empty.
ubsio.wcache.disk_evict_water_level = 90

## Number of DRAM-enabled local_service processes.
##   standalone: 1  |  inprocess:  endpoints_count * local_world_size
ubsio.standalone.device_count = 1
