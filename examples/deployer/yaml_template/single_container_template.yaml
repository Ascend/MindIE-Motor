apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindie-server
  labels:
    app: mindie-server
    ring-controller.atlas: ascend-910b
    job-name: xxxx
  namespace: mindie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mindie-server
  template:
    metadata:
      labels:
        fault-scheduling: grace
        fault-retry-times: "10000"
        app: mindie-server
        ring-controller.atlas: ascend-910b
    spec:
      schedulerName: volcano
      nodeSelector:
        accelerator: huawei-Ascend910
      terminationGracePeriodSeconds: 10
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1001
      containers:
        - image: mindie:1.0.0-aarch64-800I-A2
          imagePullPolicy: IfNotPresent
          name: mindie-server
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: Unconfined
          startupProbe:
            exec:
              command:
              - bash
              - -c
              - "$CONFIGMAP_PATH/probe.sh startup coordinator && $CONFIGMAP_PATH/probe.sh startup controller"
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 100
          readinessProbe:
            exec:
              command:
              - bash
              - -c
              - "$CONFIGMAP_PATH/probe.sh readiness coordinator && $CONFIGMAP_PATH/probe.sh readiness controller"
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
              - bash
              - -c
              - "$CONFIGMAP_PATH/probe.sh liveness coordinator && $CONFIGMAP_PATH/probe.sh liveness controller"
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 12
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: CONFIGMAP_PATH
              value: /mnt/configmap
            - name: CONFIG_PATH
              value: /usr/local/Ascend/pyMotor/conf
          lifecycle:
            preStop:
              exec:
                command: ["bash", "-c", "$CONFIGMAP_PATH/prestop.sh"]
          command: ["/bin/bash", "-c", "source /mnt/configmap/boot.sh;"]
          resources:
            requests:
              memory: "64Gi"
              cpu: "16"
              huawei.com/Ascend910: 1                         # Number of required NPUs. The maximum value is 16. You can add lines below to configure resources such as memory and CPU.
            limits:
              huawei.com/Ascend910: 1                         # The value must be consistent with that in requests.
          volumeMounts:
          - name: data
            mountPath: /data
          - name: motor-config
            mountPath: /mnt/configmap
          - name: queue-schedule
            mountPath: /var/queue_schedule
          - name: dshm
            mountPath: /dev/shm
          - name: coredump
            mountPath: /var/coredump
          - name: mnt
            mountPath: /mnt
          - name: hccn-tool
            mountPath: /usr/local/Ascend/driver/tools/hccn_tool
            readOnly: true
          - name: hccn-conf
            mountPath: /etc/hccn.conf
          - name: ascend-driver
            mountPath: /usr/local/Ascend/driver
            readOnly: true
          - name: weight-mount
            mountPath: /mnt/weight
          - name: plog-path
            mountPath: /root/ascend/log
          - name: cache-path
            mountPath: /root/.cache
          - name: dcmi
            mountPath: /usr/local/dcmi
            readOnly: true
          - name: npu-smi
            mountPath: /usr/local/bin/npu-smi
            readOnly: true
          - name: ascend-install-info
            mountPath: /etc/ascend_install.info
            readOnly: true
      volumes:
      - name: data
        hostPath:
          path: /data
      - name: motor-config
        configMap:
          name: motor-config
          defaultMode: 0550
      - name: queue-schedule
        hostPath:
          path: /var/queue_schedule
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 4Gi
      - name: coredump
        hostPath:
          path: /var/coredump
          type: DirectoryOrCreate
      - name: mnt
        hostPath:
          path: /mnt
      - name: hccn-tool
        hostPath:
          path: /usr/local/Ascend/driver/tools/hccn_tool
          type: File
      - name: hccn-conf
        hostPath:
          path: /etc/hccn.conf
      - name: ascend-driver
        hostPath:
          path: /usr/local/Ascend/driver
      - name: weight-mount
        hostPath:
          path: /mnt/weight
      - name: plog-path
        hostPath:
          path: /root/ascend/log
          type: DirectoryOrCreate
      - name: cache-path
        hostPath:
          path: /root/.cache
          type: DirectoryOrCreate
      - name: dcmi
        hostPath:
          path: /usr/local/dcmi
      - name: npu-smi
        hostPath:
          path: /usr/local/bin/npu-smi
          type: File
      - name: ascend-install-info
        hostPath:
          path: /etc/ascend_install.info
          type: File
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: mindie-motor-coordinator
  name: mindie-motor-coordinator-infer
  namespace: mindie
spec:
  ports:
    - nodePort: 31015
      port: 1025
      protocol: TCP
      targetPort: 1025
  selector:
    app: mindie-motor-coordinator
  sessionAffinity: None
  type: NodePort
status:
  loadBalancer: {}
