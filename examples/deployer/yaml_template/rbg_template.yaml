# Motor RBG v1alpha2 deployment defaults; independent of infer_service_template.yaml.
# user_config.json/env.json override their corresponding fields. Generated identity,
# namespace, group/role selectors and instance counts are managed by the renderer.
# Services below use base names; the renderer adds the logical service/role suffix.
# motor-deployer/template-role selects a Service's role and is removed from output.
# Engines also support leaderWorkerPattern with an inline template; see lib/rbg/README.md.
# Its size includes the leader and is set from single_<role>_instance_pod_num.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mindie-motor-controller
  namespace: mindie
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mindie-controller-role
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mindie-controller-binding
subjects:
- kind: ServiceAccount
  name: mindie-motor-controller
  namespace: mindie
roleRef:
  kind: ClusterRole
  name: mindie-controller-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: workloads.x-k8s.io/v1alpha2
kind: RoleBasedGroup
metadata:
  name: vllm
  namespace: mindie
spec:
  roles:
  - name: controller
    standalonePattern:
      template:
        metadata:
          labels:
            app: mindie-motor-controller
            deploy-name: mindie-motor-controller
          annotations: {}
        spec:
          serviceAccountName: mindie-motor-controller
          terminationGracePeriodSeconds: 5
          securityContext:
            fsGroup: 1001
          tolerations:
          - key: node.kubernetes.io/not-ready
            operator: Exists
            effect: NoExecute
            tolerationSeconds: 30
          - key: node.kubernetes.io/unreachable
            operator: Exists
            effect: NoExecute
            tolerationSeconds: 30
          containers:
          - image: mindie:1.0.0-aarch64-800I-A2
            imagePullPolicy: IfNotPresent
            name: mindie-motor-controller
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              seccompProfile:
                type: Unconfined
            startupProbe:
              exec:
                command:
                - bash
                - -c
                - $CONFIGMAP_PATH/probe.sh startup
              periodSeconds: 10
              failureThreshold: 100
            readinessProbe:
              exec:
                command:
                - bash
                - -c
                - $CONFIGMAP_PATH/probe.sh readiness
              periodSeconds: 10
              timeoutSeconds: 30
            livenessProbe:
              exec:
                command:
                - bash
                - -c
                - $CONFIGMAP_PATH/probe.sh liveness
              periodSeconds: 10
              timeoutSeconds: 30
            env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: CONFIGMAP_PATH
              value: /mnt/configmap
            - name: CONFIG_PATH
              value: /usr/local/Ascend/pyMotor/conf
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            command:
            - /bin/bash
            - -c
            - source /mnt/configmap/boot.sh;
            resources:
              requests:
                memory: 2Gi
                cpu: '4'
              limits:
                memory: 4Gi
                cpu: '8'
            volumeMounts:
            - name: motor-config
              mountPath: /mnt/configmap
            - name: coredump
              mountPath: /var/coredump
            - name: mnt
              mountPath: /mnt
          volumes:
          - name: motor-config
            configMap:
              name: motor-config
              defaultMode: 360
          - name: coredump
            hostPath:
              path: /var/coredump
              type: DirectoryOrCreate
          - name: mnt
            hostPath:
              path: /mnt
    replicas: 1
    podManagementPolicy: Parallel
    annotations:
      rbg.workloads.x-k8s.io/role-instance-pattern: Stateful
    rolloutStrategy:
      type: RollingUpdate
      rollingUpdate:
        type: RecreatePod
        maxUnavailable: 1
        maxSurge: 0
        partition: 0
