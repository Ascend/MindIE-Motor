apiVersion: batch/v1
kind: Job
metadata:
  name: mindie-motor-deploy
  namespace: mindie
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: mindie-motor-deployer
      restartPolicy: Never
      containers:
        - name: deployer
          image: mindie-motor-deployer:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_DIR
              value: /config
          volumeMounts:
            - name: deploy-config
              mountPath: /config
              readOnly: true
      volumes:
        - name: deploy-config
          configMap:
            name: mindie-motor-user-config
            items:
              - key: user_config.json
                path: user_config.json
              - key: env.json
                path: env.json
