<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
  <title id="title">PyMotor UCM Prefix Cache 的冷请求与热请求流程</title>
  <desc id="desc">上半部分展示首次请求未命中后计算并保存 KVCache，下半部分展示相同前缀再次请求且命中 external Store 时加载 KVCache，仅计算未命中的后缀。若命中 HBM，则无需经过 external load。</desc>
  <defs>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#f97316"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#0f9f8f"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <style>
    text { font-family: Inter, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 1.6px; fill: #e43f5a; }
    .title { font-size: 28px; font-weight: 760; }
    .track-title { font-size: 20px; font-weight: 760; }
    .node-title { font-size: 16px; font-weight: 700; }
    .small { font-size: 13px; fill: #526178; }
    .badge { font-size: 12px; font-weight: 750; }
    .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
    .cold { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.3; }
    .hot { fill: #ecfdf5; stroke: #34d399; stroke-width: 1.3; }
    .cold-line { fill: none; stroke: #f97316; stroke-width: 3; marker-end: url(#arrow-orange); }
    .hot-line { fill: none; stroke: #0f9f8f; stroke-width: 3; marker-end: url(#arrow-green); }
    .animated { stroke-dasharray: 13 9; animation: travel 1.25s linear infinite; }
    .pulse-cold { animation: pulseCold 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .pulse-hot { animation: pulseHot 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .delay-1 { animation-delay: .35s; }
    .delay-2 { animation-delay: .7s; }
    .delay-3 { animation-delay: 1.05s; }
    @keyframes travel { to { stroke-dashoffset: -44; } }
    @keyframes pulseCold { 0%, 75%, 100% { opacity: .55; } 15%, 35% { opacity: 1; } }
    @keyframes pulseHot { 0%, 75%, 100% { opacity: .55; } 15%, 35% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .animated, .pulse-cold, .pulse-hot { animation: none; }
    }
  </style>

  <rect width="1280" height="650" rx="28" fill="#f8fafc"/>
  <text x="58" y="52" class="eyebrow">COLD → WARM</text>
  <text x="58" y="89" class="title">第一次请求建立缓存，后续请求用命中结果替代重复前缀计算</text>

  <g filter="url(#shadow)">
    <rect x="58" y="124" width="1164" height="210" rx="22" class="card"/>
    <rect x="58" y="124" width="160" height="210" rx="22" fill="#f97316" opacity="0.10"/>
    <text x="83" y="165" class="track-title">首次请求</text>
    <rect x="83" y="184" width="83" height="25" rx="12.5" fill="#f97316" opacity="0.16"/>
    <text x="99" y="201" class="badge" fill="#c2410c">COLD MISS</text>
    <text x="83" y="238" class="small">完整计算前缀</text>
    <text x="83" y="261" class="small">并写入 UCM</text>

    <rect x="252" y="180" width="150" height="92" rx="16" class="cold pulse-cold"/>
    <circle cx="278" cy="207" r="13" fill="#f97316"/>
    <text x="274" y="212" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">1</text>
    <text x="300" y="212" class="node-title">前缀查询</text>
    <text x="276" y="244" class="small">未找到 KV block</text>

    <rect x="456" y="180" width="150" height="92" rx="16" class="cold pulse-cold delay-1"/>
    <circle cx="482" cy="207" r="13" fill="#f97316"/>
    <text x="478" y="212" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">2</text>
    <text x="504" y="212" class="node-title">Prefill 计算</text>
    <text x="480" y="244" class="small">计算完整公共前缀</text>

    <rect x="660" y="180" width="150" height="92" rx="16" class="cold pulse-cold delay-2"/>
    <circle cx="686" cy="207" r="13" fill="#f97316"/>
    <text x="682" y="212" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">3</text>
    <text x="708" y="212" class="node-title">Cache dump</text>
    <text x="684" y="244" class="small">Device → Host</text>

    <rect x="864" y="180" width="150" height="92" rx="16" class="cold pulse-cold delay-3"/>
    <circle cx="890" cy="207" r="13" fill="#f97316"/>
    <text x="886" y="212" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">4</text>
    <text x="912" y="212" class="node-title">Posix dump</text>
    <text x="888" y="244" class="small">Host → /mnt/ucm</text>

    <rect x="1066" y="180" width="118" height="92" rx="16" class="cold"/>
    <text x="1088" y="213" class="node-title">持久化</text>
    <text x="1088" y="240" class="small">等待复用</text>
  </g>

  <path d="M402 226H446" class="cold-line animated"/>
  <path d="M606 226H650" class="cold-line animated"/>
  <path d="M810 226H854" class="cold-line animated"/>
  <path d="M1014 226H1056" class="cold-line animated"/>

  <g filter="url(#shadow)">
    <rect x="58" y="374" width="1164" height="210" rx="22" class="card"/>
    <rect x="58" y="374" width="160" height="210" rx="22" fill="#0f9f8f" opacity="0.11"/>
    <text x="83" y="415" class="track-title">后续请求</text>
    <rect x="83" y="434" width="77" height="25" rx="12.5" fill="#0f9f8f" opacity="0.18"/>
    <text x="101" y="451" class="badge" fill="#0f766e">WARM HIT</text>
    <text x="83" y="488" class="small">加载已命中前缀</text>
    <text x="83" y="511" class="small">只计算新增后缀</text>

    <rect x="252" y="430" width="150" height="92" rx="16" class="hot pulse-hot"/>
    <circle cx="278" cy="457" r="13" fill="#0f9f8f"/>
    <text x="274" y="462" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">1</text>
    <text x="300" y="462" class="node-title">前缀查询</text>
    <text x="276" y="494" class="small">命中 KV block</text>

    <rect x="456" y="430" width="150" height="92" rx="16" class="hot pulse-hot delay-1"/>
    <circle cx="482" cy="457" r="13" fill="#0f9f8f"/>
    <text x="478" y="462" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">2</text>
    <text x="504" y="462" class="node-title">External load</text>
    <text x="480" y="494" class="small">若命中 Posix / NFS</text>

    <rect x="660" y="430" width="150" height="92" rx="16" class="hot pulse-hot delay-2"/>
    <circle cx="686" cy="457" r="13" fill="#0f9f8f"/>
    <text x="682" y="462" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">3</text>
    <text x="708" y="462" class="node-title">Cache load</text>
    <text x="684" y="494" class="small">Host → Device</text>

    <rect x="864" y="430" width="150" height="92" rx="16" class="hot pulse-hot delay-3"/>
    <circle cx="890" cy="457" r="13" fill="#0f9f8f"/>
    <text x="886" y="462" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">4</text>
    <text x="912" y="462" class="node-title">计算后缀</text>
    <text x="888" y="494" class="small">跳过已命中前缀</text>

    <rect x="1066" y="430" width="118" height="92" rx="16" class="hot"/>
    <text x="1088" y="463" class="node-title">交给 D</text>
    <text x="1088" y="490" class="small">Mooncake</text>
  </g>

  <path d="M402 476H446" class="hot-line animated"/>
  <path d="M606 476H650" class="hot-line animated"/>
  <path d="M810 476H854" class="hot-line animated"/>
  <path d="M1014 476H1056" class="hot-line animated"/>

  <text x="58" y="624" class="small">暖路径画的是 hit external；hit hbm 可跳过 external load。动画在系统启用“减少动态效果”时自动停用。</text>
</svg>
