<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc">
  <title id="title">Deployment architecture of UCM Prefix Cache in PyMotor</title>
  <desc id="desc">The top part shows the online transfer path of a request through Coordinator, Prefill, Mooncake, and Decode; the bottom part shows the prefix-cache read/write path between UCMConnector in Prefill and the Cache Store and Posix Store. Animated dashes flow along the two paths and stop when the system enables reduced motion.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#0f9f8f"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <style>
    text { font-family: Inter, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .eyebrow { font-size: 14px; font-weight: 800; letter-spacing: 1.8px; fill: #e43f5a; }
    .title { font-size: 30px; font-weight: 780; }
    .subtitle { font-size: 16px; fill: #526178; }
    .lane-label { font-size: 13px; font-weight: 800; letter-spacing: .5px; }
    .node-title { font-size: 17px; font-weight: 750; }
    .node-subtitle { font-size: 13px; fill: #64748b; }
    .connector-title { font-size: 14px; font-weight: 750; }
    .connector-note { font-size: 12px; fill: #64748b; }
    .line-label { font-size: 12px; font-weight: 700; fill: #64748b; }
    .blue-line { fill: none; stroke: #93c5fd; stroke-width: 3; marker-end: url(#arrow-blue); }
    .green-line { fill: none; stroke: #6ee7b7; stroke-width: 3; marker-start: url(#arrow-green); marker-end: url(#arrow-green); }
    .flow-blue, .flow-green {
      fill: none;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 12 20;
      animation: travel 1.35s linear infinite;
    }
    .flow-blue { stroke: #2563eb; }
    .flow-green { stroke: #0f9f8f; }
    .delay-1 { animation-delay: -.35s; }
    .delay-2 { animation-delay: -.7s; }
    @keyframes travel { to { stroke-dashoffset: -64; } }
    @media (prefers-reduced-motion: reduce) {
      .flow-blue, .flow-green { animation: none; opacity: 0; }
    }
  </style>

  <rect width="1280" height="680" rx="28" fill="#ffffff"/>
  <text x="56" y="47" class="eyebrow">PYMOTOR × UCM</text>
  <text x="56" y="87" class="title">Two paths, each with a clear role</text>
  <text x="56" y="118" class="subtitle">Mooncake handles P/D KV transfer within a single request; UCM reuses prefixes across requests on the Prefill side.</text>

  <rect x="48" y="148" width="1184" height="282" rx="24" fill="#f8fafc" stroke="#dbeafe" stroke-width="1.5"/>
  <rect x="72" y="170" width="124" height="30" rx="15" fill="#dbeafe"/>
  <text x="72" y="190" class="lane-label" fill="#1d4ed8">Online request path</text>

  <g filter="url(#shadow)">
    <rect x="80" y="246" width="140" height="92" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
    <circle cx="108" cy="275" r="12" fill="#e43f5a" opacity=".14"/>
    <circle cx="108" cy="275" r="5" fill="#e43f5a"/>
    <text x="130" y="281" class="node-title">Request</text>
    <text x="104" y="312" class="node-subtitle">OpenAI API</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="270" y="246" width="165" height="92" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
    <text x="294" y="281" class="node-title">Coordinator</text>
    <text x="294" y="312" class="node-subtitle">Select Prefill / Decode</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="485" y="190" width="330" height="202" rx="20" fill="#ffffff" stroke="#f3a0af" stroke-width="1.6"/>
    <text x="510" y="225" class="node-title">Prefill Engine</text>
    <text x="510" y="247" class="node-subtitle">vLLM computes new KV</text>

    <rect x="510" y="266" width="280" height="48" rx="11" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="524" y="278" width="28" height="23" rx="11.5" fill="#2563eb"/>
    <text x="538" y="294" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">0</text>
    <text x="564" y="286" class="connector-title">Mooncake transfer Connector</text>
    <text x="564" y="302" class="connector-note">Implementation selected by PD solution</text>

    <rect x="510" y="326" width="280" height="48" rx="11" fill="#ecfdf5" stroke="#6ee7b7"/>
    <rect x="524" y="338" width="28" height="23" rx="11.5" fill="#0f9f8f"/>
    <text x="538" y="354" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">1</text>
    <text x="564" y="346" class="connector-title">UCMConnector</text>
    <text x="564" y="362" class="connector-note">Look up, load, and save prefixes</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="930" y="212" width="250" height="158" rx="20" fill="#ffffff" stroke="#93c5fd" stroke-width="1.6"/>
    <text x="955" y="248" class="node-title">Decode Engine</text>
    <text x="955" y="270" class="node-subtitle">vLLM generates subsequent tokens</text>
    <rect x="955" y="294" width="200" height="48" rx="11" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="973" y="315" class="connector-title">Mooncake Connector</text>
    <text x="973" y="331" class="connector-note">Match the Prefill transfer config</text>
  </g>

  <path d="M220 292H260" class="blue-line"/>
  <path d="M435 292H475" class="blue-line"/>
  <path d="M790 290H920" class="blue-line"/>
  <path d="M220 292H260" class="flow-blue"/>
  <path d="M435 292H475" class="flow-blue delay-1"/>
  <path d="M790 290H920" class="flow-blue delay-2"/>
  <text x="834" y="278" class="line-label">P/D KV</text>

  <rect x="48" y="456" width="1184" height="166" rx="24" fill="#f0fdfa" stroke="#a7f3d0" stroke-width="1.5"/>
  <rect x="72" y="478" width="152" height="30" rx="15" fill="#ccfbf1"/>
  <text x="92" y="498" class="lane-label" fill="#0f766e">Cross-request prefix cache</text>
  <text x="88" y="546" class="node-title">UCM integrates with Prefill only</text>
  <text x="88" y="571" class="node-subtitle">Decode does not load UCMConnector</text>

  <g filter="url(#shadow)">
    <rect x="528" y="518" width="244" height="72" rx="16" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.4"/>
    <text x="554" y="548" class="node-title">Cache Store</text>
    <text x="554" y="573" class="node-subtitle">Device ↔ Host Memory</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="850" y="518" width="282" height="72" rx="16" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.4"/>
    <text x="876" y="548" class="node-title">Posix Store</text>
    <text x="876" y="573" class="node-subtitle">/mnt/ucm · PVC / NFS / HostPath</text>
  </g>

  <path d="M650 374V508" class="green-line"/>
  <path d="M650 374V508" class="flow-green"/>
  <text x="670" y="451" class="line-label">lookup / load / save</text>
  <path d="M772 554H840" class="green-line"/>
  <path d="M772 554H840" class="flow-green delay-1"/>
  <text x="782" y="540" class="line-label">dump / load</text>

  <text x="56" y="654" class="node-subtitle">Configuration order: connectors[0] = Mooncake transfer Connector; connectors[1] = UCMConnector.</text>
</svg>
